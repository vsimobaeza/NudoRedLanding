<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Spline+Sans+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0D131C; --green-dark:#2FD08A; --band-soft:#9AA6B0;
    --sans:"Archivo","Segoe UI",Arial,sans-serif;
    --mono:"Spline Sans Mono",Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1200px;height:630px;}
  body{
    background:var(--ink);color:#F4F6F5;font-family:var(--sans);
    -webkit-font-smoothing:antialiased;overflow:hidden;position:relative;
  }
  /* trama sutil de nodos a la derecha */
  .grid{position:absolute;inset:0;
    background-image:radial-gradient(rgba(47,208,138,.16) 1.4px, transparent 1.4px);
    background-size:34px 34px;
    -webkit-mask-image:linear-gradient(105deg, transparent 46%, #000 92%);
            mask-image:linear-gradient(105deg, transparent 46%, #000 92%);
  }
  .frame{position:relative;height:100%;padding:64px 72px;display:flex;flex-direction:column;justify-content:space-between;}
  .mast{display:flex;justify-content:space-between;align-items:center;
    border-bottom:1px solid rgba(255,255,255,.16);padding-bottom:22px;}
  .brand{display:inline-flex;align-items:center;gap:14px;}
  .logo-mark{width:46px;height:46px;display:block;flex:none;}
  .logo-mark .edge{stroke:#AEB9C2;stroke-width:2.6;}
  .logo-mark .node{fill:#E8ECEA;}
  .logo-mark .node.on{fill:var(--green-dark);}
  .wordmark{font-weight:800;font-stretch:122%;font-size:34px;letter-spacing:-.01em;}
  .wordmark b{color:var(--green-dark);}
  .kicker{font-family:var(--mono);font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--band-soft);text-align:right;line-height:1.5;}

  .mid{margin-top:6px;}
  .rule{height:3px;width:56px;background:#C07C08;margin-bottom:26px;}
  h1{font-size:62px;line-height:1.03;font-weight:800;font-stretch:115%;letter-spacing:-.02em;color:#fff;max-width:19ch;}
  h1 em{font-style:normal;color:var(--green-dark);}
  .lede{margin-top:24px;font-size:23px;line-height:1.5;color:#C9D2D8;max-width:34ch;}
  .lede b{color:#fff;font-weight:640;}

  .facts{display:flex;gap:34px;font-family:var(--mono);font-size:16px;letter-spacing:.09em;text-transform:uppercase;color:var(--band-soft);}
  .facts b{color:#F4F6F5;font-weight:600;}
  .facts .amber{color:#E7A93B;}
  .dot{color:rgba(255,255,255,.28);}
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="frame">
    <div class="mast">
      <div class="brand">
        <svg class="logo-mark" viewBox="0 0 40 40" fill="none" role="img" aria-label="NudoRed">
          <path class="edge" d="M9 31 V9 L31 31 V9" stroke-linecap="round" stroke-linejoin="round"/>
          <circle class="node" cx="9" cy="31" r="3"/>
          <circle class="node" cx="9" cy="9" r="3"/>
          <circle class="node" cx="31" cy="31" r="3"/>
          <circle class="node on" cx="31" cy="9" r="4.4"/>
        </svg>
        <span class="wordmark">Nudo<b>Red</b></span>
      </div>
      <div class="kicker">Spanish Grid<br>Capacity Intelligence</div>
    </div>

    <div class="mid">
      <div class="rule"></div>
      <h1>Dónde la red española tiene sitio, <em>cada mes</em>.</h1>
      <p class="lede">Capacidad de acceso <b>nodo a nodo</b> (CEP/CAD) y qué nodos se mueven mes a mes. Datos CNMC, curados.</p>
    </div>

    <div class="facts">
      <span><b>1</b> email/mes</span>
      <span class="dot">·</span>
      <span><b class="amber">CEP / CAD</b> nodo a nodo</span>
      <span class="dot">·</span>
      <span>Fuente <b>CNMC</b></span>
    </div>
  </div>
</body>
</html>
